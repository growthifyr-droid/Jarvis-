appId: com.jarvis.desktop
productName: JARVIS

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JARVIS

publish:
  provider: github
  owner: YOUR_GITHUB_USERNAME
  repo: YOUR_JARVIS_REPOSITORY
  releaseType: release
  publishAutoUpdate: true
