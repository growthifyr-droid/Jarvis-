appId: com.jarvis.desktop
productName: JARVIS

directories:
  output: release
  buildResources: build

files:
  - dist-electron/**
  - dist/**
  - package.json
  - build/**

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JARVIS
