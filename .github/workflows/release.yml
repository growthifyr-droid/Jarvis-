name: Build and Release Jarvis

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: jarvis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and native Windows toolchains
        shell: pwsh
        run: |
          Write-Host "Installing dependencies..."
          npm install

          Write-Host "Installing Windows-specific native binaries (Tailwind Oxide, LightningCSS, Rollup, ESBuild)..."
          npm install --no-save @tailwindcss/oxide-win32-x64-msvc lightningcss-win32-x64-msvc @rollup/rollup-win32-x64-msvc @esbuild/win32-x64

          Write-Host "Verifying toolchains..."
          node -e "require('@tailwindcss/oxide-win32-x64-msvc'); console.log('Tailwind Oxide Windows OK');"
          node -e "require('lightningcss-win32-x64-msvc'); console.log('LightningCSS Windows OK');"
          node -e "require('@rollup/rollup-win32-x64-msvc'); console.log('Rollup Windows OK');"

      - name: Validate package version
        shell: pwsh
        run: |
          if (-not (Test-Path "package.json")) {
            Write-Error "package.json not found."
            exit 1
          }

          $version = node -p "require('./package.json').version"

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "package.json version is missing."
            exit 1
          }

          Write-Host "Target Application Version: $version"

      - name: Build Windows installer
        shell: pwsh
        run: npm run release

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"

          Write-Host "Locating release assets in ./release directory..."
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } | Select-Object -ExpandProperty FullName

          if (-not $files) {
            Write-Error "No release artifacts found in release directory."
            exit 1
          }

          Write-Host "Found artifacts to upload:"
          $files | ForEach-Object { Write-Host " - $_" }

          # Check if release tag already exists
          $exists = $false
          $res = gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0 -and $res) {
            $exists = $true
          }
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Host "Release $tag already exists on GitHub. Updating and overwriting release assets..."
            gh release upload $tag $files --repo "${{ github.repository }}" --clobber
            Write-Host "Existing release $tag updated successfully with new assets!"
          } else {
            Write-Host "Creating new GitHub release for $tag..."
            gh release create $tag $files --repo "${{ github.repository }}" --title "JARVIS $tag" --generate-notes --target "${{ github.sha }}"
            Write-Host "New release $tag published successfully to GitHub!"
          }
