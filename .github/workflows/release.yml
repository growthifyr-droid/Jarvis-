name: Build and Release Jarvis

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: jarvis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        shell: pwsh
        run: |
          if (-not (Test-Path "package.json")) {
            Write-Error "package.json not found."
            exit 1
          }

          $version = node -p "require('./package.json').version"

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "package.json version is missing."
            exit 1
          }

          Write-Host "Application version: $version"

      - name: Validate version is not already released
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"

          gh release view $tag --repo "${{ github.repository }}" 2>$null

          if ($LASTEXITCODE -eq 0) {
            Write-Error "Release $tag already exists. Increase package.json version before pushing."
            exit 1
          }

          Write-Host "No existing release found for $tag."

      - name: Build and publish Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Show build result
        shell: pwsh
        run: |
          Write-Host "Jarvis release workflow completed."
