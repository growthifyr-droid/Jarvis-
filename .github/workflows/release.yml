name: Build and Release Jarvis

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: jarvis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. SETUP NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ==========================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        shell: pwsh
        run: |
          Write-Host "Installing project dependencies..."

          if (Test-Path "package-lock.json") {
            npm ci
          } else {
            npm install
          }

      # ==========================================
      # 4. INSTALL WINDOWS NATIVE BINARIES (FORCED)
      # ==========================================
      - name: Install Windows native binaries
        shell: pwsh
        run: |
          Write-Host "Force-installing Windows native binaries..."

          npm install --no-save --force `
            @tailwindcss/oxide-win32-x64-msvc `
            lightningcss-win32-x64-msvc `
            @rollup/rollup-win32-x64-msvc `
            @esbuild/win32-x64

          Write-Host ""
          Write-Host "Verifying native binaries (folder check)..."

          $packages = @(
            "@tailwindcss/oxide-win32-x64-msvc",
            "lightningcss-win32-x64-msvc",
            "@rollup/rollup-win32-x64-msvc",
            "@esbuild/win32-x64"
          )

          $allOk = $true

          foreach ($pkg in $packages) {
            $pkgPath = Join-Path "node_modules" ($pkg -replace "/", [IO.Path]::DirectorySeparatorChar)
            if (Test-Path $pkgPath) {
              Write-Host "OK: $pkg found at $pkgPath"
            } else {
              Write-Host "MISSING: $pkg not found in node_modules"
              $allOk = $false
            }
          }

          if (-not $allOk) {
            Write-Host ""
            Write-Host "Some native binaries are still missing. Retrying with clean install..."

            foreach ($pkg in $packages) {
              $pkgPath = Join-Path "node_modules" ($pkg -replace "/", [IO.Path]::DirectorySeparatorChar)
              if (-not (Test-Path $pkgPath)) {
                Write-Host "Retrying install for: $pkg"
                npm install --no-save --force $pkg
              }
            }

            foreach ($pkg in $packages) {
              $pkgPath = Join-Path "node_modules" ($pkg -replace "/", [IO.Path]::DirectorySeparatorChar)
              if (-not (Test-Path $pkgPath)) {
                Write-Error "FATAL: $pkg could not be installed after retry."
                exit 1
              }
            }
          }

          Write-Host ""
          Write-Host "All Windows native binaries verified successfully."

      # ==========================================
      # 5. VALIDATE PACKAGE
      # ==========================================
      - name: Validate package
        shell: pwsh
        run: |
          if (-not (Test-Path "package.json")) {
            Write-Error "package.json not found."
            exit 1
          }

          $version = node -p "require('./package.json').version"

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "package.json version is missing."
            exit 1
          }

          Write-Host "Jarvis version: $version"

      # ==========================================
      # 6. RESOLVE VERSION (AUTO-BUMP, BOTH TAG FORMATS)
      # ==========================================
      # electron-builder kabhi "v1.0.1" aur kabhi "1.0.1" tag banata hai
      # (config pe depend karta hai). Isliye DONO formats check karo.
      - name: Resolve release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          Write-Host "package.json version: $version"

          Write-Host "Fetching existing releases (including drafts)..."
          $releases = gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName,isDraft | ConvertFrom-Json
          $existingTags = @()
          if ($null -ne $releases) {
            $existingTags = @($releases | ForEach-Object { $_.tagName })
          }

          function Test-VersionExists($v) {
            return ($existingTags -contains "v$v") -or ($existingTags -contains "$v")
          }

          if (Test-VersionExists $version) {
            Write-Host "Release for $version already exists. Auto-bumping..."

            $parts = $version.Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2]

            do {
              $patch++
              $newVersion = "$major.$minor.$patch"
            } while (Test-VersionExists $newVersion)

            Write-Host "Next available version: $newVersion"

            npm version $newVersion --no-git-tag-version --allow-same-version

            Write-Host "package.json updated to $newVersion for this build."
          } else {
            Write-Host "No existing release for $version. Continuing."
          }

          $finalVersion = node -p "require('./package.json').version"
          Write-Host ""
          Write-Host "Final build version: $finalVersion"

          $global:LASTEXITCODE = 0

      # ==========================================
      # 7. CLEAN CONFLICTING DRAFTS
      # ==========================================
      # Agar isi version ka koi purana DRAFT release pada hai
      # (partial/failed upload wala), to delete kar do taake
      # electron-builder ekdum clean release banaye aur assets
      # do drafts mein split na hon. Sirf DRAFTS delete hote hain,
      # published releases kabhi nahi.
      - name: Clean conflicting draft releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tagsToClean = @("v$version", "$version")

          $releases = gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName,isDraft | ConvertFrom-Json
          $drafts = @()
          if ($null -ne $releases) {
            $drafts = @($releases | Where-Object { $_.isDraft -eq $true } | ForEach-Object { $_.tagName })
          }

          foreach ($d in $drafts) {
            if ($tagsToClean -contains $d) {
              Write-Host "Deleting conflicting draft release: $d"
              gh release delete $d --repo "${{ github.repository }}" --yes --cleanup-tag
            }
          }

          Write-Host "Draft cleanup complete."
          $global:LASTEXITCODE = 0

      # ==========================================
      # 8. BUILD + PUBLISH TO GITHUB
      # ==========================================
      - name: Build and publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Starting production build..."

          npm run build

          Write-Host "Building Windows installer and publishing GitHub release..."

          npx electron-builder --win --publish always

      # ==========================================
      # 9. VERIFY RELEASE ARTIFACTS
      # ==========================================
      - name: Verify release artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "release")) {
            Write-Error "Release directory was not created."
            exit 1
          }

          Write-Host ""
          Write-Host "Release artifacts:"
          Get-ChildItem -Path "release" -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

          $exe = Get-ChildItem -Path "release" -Filter "*.exe" -File

          if (-not $exe) {
            Write-Error "Windows .exe installer was not generated."
            exit 1
          }

          Write-Host ""
          Write-Host "Windows installer found:"
          $exe | ForEach-Object {
            Write-Host " - $($_.FullName)"
          }

          $latestYml = Get-ChildItem -Path "release" -Filter "latest.yml" -File

          if (-not $latestYml) {
            Write-Error "latest.yml was not generated. Auto-update metadata is missing."
            exit 1
          }

          Write-Host ""
          Write-Host "Auto-update metadata found:"
          Write-Host " - $($latestYml.FullName)"

          $blockmap = Get-ChildItem -Path "release" -Filter "*.blockmap" -File

          if (-not $blockmap) {
            Write-Warning "No .blockmap file found. Verify whether the configured installer/update strategy requires it."
          } else {
            Write-Host ""
            Write-Host "Blockmap found:"
            $blockmap | ForEach-Object {
              Write-Host " - $($_.FullName)"
            }
          }

      # ==========================================
      # 10. PUBLISH THE DRAFT (AUTO-UPDATER NEEDS THIS)
      # ==========================================
      # electron-builder by default DRAFT release banata hai.
      # Draft releases auto-updater ko dikhai NAHI dete.
      # Isliye build ke baad draft ko published mein convert karo.
      - name: Publish release (remove draft status)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $found = $false

          foreach ($t in @("v$version", "$version")) {
            gh release view $t --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Found release $t. Publishing (removing draft status)..."
              gh release edit $t --repo "${{ github.repository }}" --draft=false
              Write-Host "Release $t is now PUBLISHED."
              $found = $true
              break
            }
          }

          if (-not $found) {
            Write-Error "Release for version $version not found after build."
            exit 1
          }

          $global:LASTEXITCODE = 0

      # ==========================================
      # 11. FINAL STATUS
      # ==========================================
      - name: Release completed
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "JARVIS RELEASE SUCCESSFUL"
          Write-Host "Version: $version"
          Write-Host "Status: PUBLISHED (auto-updater visible)"
          Write-Host "=========================================="
