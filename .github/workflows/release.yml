name: Build and Release Jarvis

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: jarvis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path "package-lock.json") {
            Write-Host "Found package-lock.json, running npm ci..."
            npm ci
          } else {
            Write-Host "package-lock.json not found, running npm install..."
            npm install
          }

      - name: Validate package
        shell: pwsh
        run: |
          if (-not (Test-Path "package.json")) {
            Write-Error "package.json not found."
            exit 1
          }

          $version = node -p "require('./package.json').version"

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "package.json version is missing."
            exit 1
          }

          Write-Host "Application version: $version"

      - name: Validate version is not already released
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"

          $exists = $false
          $res = gh api "repos/${{ github.repository }}/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0 -and $res) {
            $exists = $true
          }

          # Explicitly clear LASTEXITCODE so pwsh does not treat gh 404 as step failure
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Error "Release $tag already exists on GitHub. Please update the version in package.json before pushing."
            exit 1
          }

          Write-Host "Version validation passed: $tag is ready for release."
          exit 0

      - name: Build and publish Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Show build result
        shell: pwsh
        run: |
          Write-Host "Jarvis release workflow completed successfully."
