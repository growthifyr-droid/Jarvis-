name: Build and Release Jarvis

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: jarvis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and native Windows toolchains
        shell: pwsh
        run: |
          Write-Host "Installing dependencies..."
          npm install

          Write-Host "Installing Windows-specific native binaries (Tailwind Oxide, LightningCSS, Rollup, ESBuild)..."
          npm install --no-save @tailwindcss/oxide-win32-x64-msvc lightningcss-win32-x64-msvc @rollup/rollup-win32-x64-msvc @esbuild/win32-x64

          Write-Host "Verifying toolchains..."
          node -e "require('@tailwindcss/oxide-win32-x64-msvc'); console.log('Tailwind Oxide Windows OK');"
          node -e "require('lightningcss-win32-x64-msvc'); console.log('LightningCSS Windows OK');"
          node -e "require('@rollup/rollup-win32-x64-msvc'); console.log('Rollup Windows OK');"

      - name: Validate package version
        shell: pwsh
        run: |
          if (-not (Test-Path "package.json")) {
            Write-Error "package.json not found."
            exit 1
          }

          $version = node -p "require('./package.json').version"

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "package.json version is missing."
            exit 1
          }

          Write-Host "Application version: $version"

      - name: Check for existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"

          $exists = $false
          $res = gh api "repos/${{ github.repository }}/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0 -and $res) {
            $exists = $true
          }

          # Reset exit code
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Error "Release $tag already exists on GitHub. Please bump the version in package.json before releasing."
            exit 1
          }

          Write-Host "Version validation passed: $tag is ready for build."
          exit 0

      - name: Build Windows installer
        shell: pwsh
        run: npm run release

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"

          Write-Host "Locating release assets..."
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } | Select-Object -ExpandProperty FullName

          if (-not $files) {
            Write-Error "No release artifacts found in release directory."
            exit 1
          }

          Write-Host "Uploading release assets for $tag :"
          $files | ForEach-Object { Write-Host " - $_" }

          gh release create $tag $files --title "JARVIS $tag" --generate-notes --target "${{ github.sha }}"
          Write-Host "JARVIS $tag released successfully to GitHub!"
